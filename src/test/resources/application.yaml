spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;NON_KEYWORDS=YEAR
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  main:
    allow-bean-definition-overriding: true

server:
  port: 0

logging:
  level:
    org.springframework.batch: INFO
    com.sawmik.spring_batch: DEBUG
